<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Viral Content Radar — Venus Impact</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;--border-hover:#7c3aed;--accent:#a855f7;--accent-border:#7c3aed;--accent-dim:rgba(168,85,247,0.08);--text:#e8e8f0;--text-muted:#6b6b8a;--green:#22c55e;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:16px;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
  .logo{height:42px;}
  .header-sub{font-size:12px;color:var(--text-muted);margin-top:4px;}
  .section-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--text-muted);margin-bottom:12px;}
  .sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:20px;}
  .sector-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 8px;cursor:pointer;text-align:center;transition:all 0.2s;font-size:12px;color:var(--text-muted);font-family:'DM Sans',sans-serif;position:relative;overflow:hidden;}
  .sector-btn:hover{border-color:var(--border-hover);color:var(--text);}
  .sector-btn.active{border-color:var(--accent-border);color:var(--accent);background:var(--accent-dim);}
  .sector-icon{font-size:22px;display:block;margin-bottom:8px;}
  .sector-name{font-size:11px;line-height:1.3;}
  .custom-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;margin-bottom:20px;transition:border-color 0.2s;}
  .custom-input:focus{border-color:var(--accent-border);}
  .custom-input::placeholder{color:var(--text-muted);}
  .platforms{display:flex;gap:10px;margin-bottom:20px;}
  .platform-btn{padding:8px 18px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-family:'DM Sans',sans-serif;font-size:12px;cursor:pointer;transition:all 0.2s;}
  .platform-btn.active{border-color:var(--accent-border);background:var(--accent-dim);color:var(--accent);}
  .analyze-btn{width:100%;padding:18px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:opacity 0.2s;margin-bottom:24px;}
  .analyze-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .analyze-btn:not(:disabled):hover{opacity:0.9;}
  .loading{text-align:center;padding:48px;color:var(--text-muted);display:none;}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .results{display:none;}
  .results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px;}
  .results-title{font-size:20px;font-weight:600;}
  .platform-tag{font-size:10px;letter-spacing:2px;padding:4px 10px;border-radius:20px;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent-border);}
  .new-search-btn{font-size:11px;color:var(--text-muted);background:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:'DM Sans',sans-serif;}
  .video-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:12px;}
  .video-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .video-title{font-size:15px;font-weight:500;line-height:1.4;flex:1;}
  .plat-badge{font-size:10px;padding:3px 8px;border-radius:10px;white-space:nowrap;font-weight:600;}
  .plat-tiktok{background:rgba(0,0,0,0.6);color:#fff;border:1px solid #333;}
  .plat-instagram{background:rgba(225,48,108,0.15);color:#e1306c;border:1px solid rgba(225,48,108,0.3);}
  .estructura{font-size:12px;color:var(--text-muted);margin-bottom:10px;line-height:1.6;padding:10px;background:rgba(168,85,247,0.05);border-radius:8px;border-left:2px solid var(--accent-border);}
  .viralidad{font-size:12px;color:#a0a0c0;margin-bottom:10px;font-style:italic;}
  .tags-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .tag{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--text-muted);}
  .meta{font-size:10px;color:var(--text-muted);padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--border);}
  .patterns{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:24px;}
  .patterns-title{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase;}
  .pattern-item{font-size:13px;color:var(--text-muted);padding:8px 0;border-bottom:1px solid var(--border);line-height:1.5;}
  .pattern-item:last-child{border-bottom:none;padding-bottom:0;}
  .pattern-item::before{content:"→ ";color:var(--accent);}
  .error-box{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:16px;color:#f87171;font-size:13px;text-align:center;}
  @media(max-width:480px){header{flex-direction:column;align-items:flex-start}.sector-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

    <button class="sector-btn" data-sector="Energía solar y renovables"><span class="sector-icon">☀️</span><span class="sector-name">Solar</span></button>

</div>

<div class="results" id="resultsPanel"></div>

<script>
let selectedSector = '';
let selectedPlatforms = ['TikTok', 'Instagram Reels'];

document.querySelectorAll('.sector-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sector-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedSector = btn.dataset.sector;
    document.getElementById('customSector').value = '';
    updateBtn();
  });
});

document.getElementById('customSector').addEventListener('input', e => {
  if (e.target.value.trim()) {
    document.querySelectorAll('.sector-btn').forEach(b => b.classList.remove('active'));
    selectedSector = e.target.value.trim();
  } else {
    selectedSector = '';
  }
  updateBtn();
});

document.querySelectorAll('.platform-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('active');
    selectedPlatforms = [...document.querySelectorAll('.platform-btn.active')].map(b => b.dataset.plat);
    updateBtn();
  });
});

function updateBtn() {
  const btn = document.getElementById('analyzeBtn');
  if (selectedSector && selectedPlatforms.length > 0) {
    btn.disabled = false;
    btn.textContent = `Analizar tendencias → ${selectedSector}`;
  } else {
    btn.disabled = true;
    btn.textContent = 'Selecciona un sector para comenzar';
  }
}

document.getElementById('analyzeBtn').addEventListener('click', analyze);

async function analyze() {
  document.getElementById('searchPanel').style.display = 'none';
  document.getElementById('loadingPanel').style.display = 'block';
  document.getElementById('resultsPanel').style.display = 'none';

  const plats = selectedPlatforms.join(' e ');
  const prompt = `Eres un experto en marketing viral. Da exactamente 5 ideas de videos virales de ${plats} para el sector "${selectedSector}" en España 2025. Responde SOLO con este JSON sin texto adicional:
{"videos":[{"titulo":"...","plataforma":"TikTok o Instagram Reels","estructura":"GANCHO: ... → DESARROLLO: ... → CIERRE: ...","duracion":"30s","tags":["tag1","tag2","tag3"],"viralidad":"por qué funciona en 1 frase","vistas":"rango estimado"}],"patrones":["patron1","patron2","patron3"]}`;

  try {
    const resp = await fetch('/.netlify/functions/analyze', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        messages: [{role: 'user', content: prompt}]
      })
    });

    if (!resp.ok) throw new Error('Error ' + resp.status);

    const data = await resp.json();
    const text = data.content[0].text;
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    showResults(parsed);
  } catch(err) {
    document.getElementById('loadingPanel').style.display = 'none';
    document.getElementById('searchPanel').style.display = 'block';
    document.getElementById('resultsPanel').style.display = 'none';
    // Show error inside results temporarily
    const errDiv = document.createElement('div');
    errDiv.className = 'error-box';
    errDiv.textContent = '⚠ Error al conectar con la API. Inténtalo de nuevo.';
    document.getElementById('searchPanel').prepend(errDiv);
    setTimeout(() => errDiv.remove(), 5000);
  }
}

function showResults(data) {
  document.getElementById('loadingPanel').style.display = 'none';

  const panel = document.getElementById('resultsPanel');
  panel.style.display = 'block';

  const platsText = selectedPlatforms.join(' + ');
  let html = `<div class="results-header">
    <div class="results-title">${selectedSector}</div>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="platform-tag">${platsText}</span>
      <button class="new-search-btn" onclick="newSearch()">↩ Nueva búsqueda</button>
    </div>
  </div>`;

  if (data.patrones && data.patrones.length) {
    html += `<div class="patterns"><div class="patterns-title">⚡ Patrones detectados</div>`;
    data.patrones.forEach(p => { html += `<div class="pattern-item">${p}</div>`; });
    html += `</div>`;
  }

  if (data.videos && data.videos.length) {
    data.videos.forEach(v => {
      const badgeClass = v.plataforma && v.plataforma.includes('TikTok') ? 'plat-tiktok' : 'plat-instagram';
      const badgeIcon = v.plataforma && v.plataforma.includes('TikTok') ? '▶ TikTok' : '✦ Instagram';
      const tags = (v.tags || []).map(t => `<span class="tag">${t}</span>`).join('');
      html += `<div class="video-card">
        <div class="video-header">
          <div class="video-title">${v.titulo}</div>
          <span class="plat-badge ${badgeClass}">${badgeIcon}</span>
        </div>
        <div class="estructura">${v.estructura}</div>
        <div class="viralidad">${v.viralidad}</div>
        <div class="tags-row">${tags}<span class="meta">⏱ ${v.duracion}</span><span class="meta">👁 ${v.vistas}</span></div>
      </div>`;
    });
  }

  panel.innerHTML = html;
}

function newSearch() {
  document.getElementById('resultsPanel').style.display = 'none';
  document.getElementById('searchPanel').style.display = 'block';
}
</script>
</body>
</html>
