<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viral Content Radar — Venus Impact</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f; --surface: #12121a; --surface2: #1a1a26;
    --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.15);
    --text: #f0eff8; --text-muted: #7a7990; --text-dim: #4a4860;
    --accent: #7c6ff7; --accent-dim: rgba(124,111,247,0.12); --accent-border: rgba(124,111,247,0.35);
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(124,111,247,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(124,111,247,0.03) 1px, transparent 1px);
    background-size: 60px 60px; pointer-events: none; z-index: 0;
  }
  .wrapper { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 0 24px 80px; }
  header { padding: 48px 0 40px; border-bottom: 1px solid var(--border); margin-bottom: 48px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .logo { font-family: 'DM Serif Display', serif; font-size: 13px; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-bottom: 16px; }
  header h1 { font-family: 'DM Serif Display', serif; font-size: clamp(32px, 5vw, 48px); font-weight: 400; line-height: 1.1; letter-spacing: -0.02em; }
  header h1 em { font-style: italic; color: var(--accent); }
  .header-sub { font-size: 14px; color: var(--text-muted); max-width: 340px; line-height: 1.6; text-align: right; }
  .section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 14px; }
  .sector-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .sector-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 8px; cursor: pointer; text-align: center; transition: all 0.2s; font-size: 12px; color: var(--text-muted); font-family: 'DM Sans', sans-serif; position: relative; overflow: hidden; }
  .sector-btn::before { content: ''; position: absolute; inset: 0; background: var(--accent-dim); opacity: 0; transition: opacity 0.2s; }
  .sector-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .sector-btn:hover::before { opacity: 1; }
  .sector-btn.active { border-color: var(--accent-border); color: var(--accent); }
  .sector-btn.active::before { opacity: 1; }
  .sector-icon { font-size: 22px; display: block; margin-bottom: 8px; position: relative; }
  .sector-name { position: relative; font-size: 11px; line-height: 1.3; }
  .custom-row { display: flex; gap: 8px; margin-bottom: 36px; margin-top: 4px; }
  .custom-input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: var(--text); outline: none; transition: border-color 0.2s; }
  .custom-input::placeholder { color: var(--text-dim); }
  .custom-input:focus { border-color: var(--accent-border); }
  .divider { height: 1px; background: var(--border); margin: 36px 0; }
  .platform-row { display: flex; gap: 10px; margin-bottom: 36px; flex-wrap: wrap; }
  .platform-btn { display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 999px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; font-family: 'DM Sans', sans-serif; font-weight: 500; background: var(--surface); color: var(--text-muted); transition: all 0.2s; }
  .platform-btn.active-tt { background: #1a1a1a; color: #fff; border-color: #333; }
  .platform-btn.active-ig { background: linear-gradient(135deg, rgba(225,48,108,0.2), rgba(131,58,180,0.2)); color: #e879aa; border-color: rgba(225,48,108,0.3); }
  .platform-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .analyze-btn { width: 100%; padding: 18px 24px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 500; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s; margin-bottom: 48px; }
  .analyze-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(124,111,247,0.35); }
  .analyze-btn:disabled { background: var(--surface2); color: var(--text-dim); cursor: not-allowed; }
  .results { display: none; }
  .results-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px; }
  .results-title { font-family: 'DM Serif Display', serif; font-size: 22px; font-weight: 400; }
  .badge { font-size: 11px; padding: 4px 12px; border-radius: 999px; background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border); font-weight: 500; letter-spacing: 0.05em; }
  .video-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 12px; transition: all 0.2s; animation: fadeUp 0.4s ease both; }
  .video-card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  .video-card:nth-child(1){animation-delay:.05s} .video-card:nth-child(2){animation-delay:.1s} .video-card:nth-child(3){animation-delay:.15s} .video-card:nth-child(4){animation-delay:.2s} .video-card:nth-child(5){animation-delay:.25s} .video-card:nth-child(6){animation-delay:.3s}
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
  .card-title { font-size: 15px; font-weight: 500; line-height: 1.4; flex: 1; }
  .plat-badge { font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 999px; letter-spacing: 0.08em; white-space: nowrap; flex-shrink: 0; }
  .plat-badge.tt { background: #1a1a1a; color: #fff; border: 1px solid #333; }
  .plat-badge.ig { background: linear-gradient(135deg, rgba(225,48,108,0.15), rgba(131,58,180,0.15)); color: #e879aa; border: 1px solid rgba(225,48,108,0.25); }
  .card-structure { font-size: 13px; color: var(--text-muted); line-height: 1.7; margin-bottom: 10px; }
  .card-why { font-size: 12px; color: var(--text-dim); line-height: 1.6; margin-bottom: 14px; padding-left: 12px; border-left: 2px solid var(--accent-border); font-style: italic; }
  .card-footer { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 12px; border-top: 1px solid var(--border); }
  .tag { font-size: 11px; padding: 4px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 999px; color: var(--text-muted); }
  .tag.stat { color: var(--accent); background: var(--accent-dim); border-color: var(--accent-border); }
  .insights-box { margin-top: 28px; background: linear-gradient(135deg, rgba(124,111,247,0.06), rgba(201,168,76,0.04)); border: 1px solid var(--accent-border); border-radius: 14px; padding: 22px 24px; }
  .insights-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-dim); border: 1px solid var(--accent-border); display: inline-flex; align-items: center; justify-content: center; font-size: 14px; color: var(--accent); margin-right: 10px; vertical-align: middle; }
  .insights-title { font-size: 14px; font-weight: 500; color: var(--accent); vertical-align: middle; }
  .insights-list { list-style: none; margin-top: 16px; display: grid; gap: 10px; }
  .insights-list li { font-size: 13px; color: var(--text-muted); line-height: 1.6; padding-left: 18px; position: relative; }
  .insights-list li::before { content: '→'; position: absolute; left: 0; color: var(--accent); font-size: 12px; }
  .reset-btn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); background: none; border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
  .reset-btn:hover { border-color: var(--border-hover); color: var(--text-muted); }
  footer { text-align: center; padding: 40px 0 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-dim); }
  footer span { color: var(--accent); }
  @media(max-width:480px){ header{flex-direction:column;align-items:flex-start} .header-sub{text-align:left} .sector-grid{grid-template-columns:repeat(3,1fr)} }
</style>
</head>

let selectedSector = '';
let platforms = { tiktok: true, instagram: true };

document.querySelectorAll('.sector-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sector-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedSector = btn.dataset.sector;
    document.getElementById('customSector').value = '';
    updateBtn();
  });
});

document.getElementById('customSector').addEventListener('input', function() {
  document.querySelectorAll('.sector-btn').forEach(b => b.classList.remove('active'));
  selectedSector = this.value.trim() ? 'custom' : '';
  updateBtn();
});

function togglePlatform(p) {
  platforms[p] = !platforms[p];
  if (!platforms.tiktok && !platforms.instagram) platforms[p] = true;
  document.getElementById('btnTT').className = 'platform-btn' + (platforms.tiktok ? ' active-tt' : '');
  document.getElementById('btnIG').className = 'platform-btn' + (platforms.instagram ? ' active-ig' : '');
}

function updateBtn() {
  const btn = document.getElementById('analyzeBtn');
  const s = selectedSector || document.getElementById('customSector').value.trim();
  if (s) {
    btn.disabled = false;
    const label = DATA[selectedSector] ? DATA[selectedSector].label : document.getElementById('customSector').value.trim();
    btn.textContent = 'Analizar tendencias → ' + label;
  } else {
    btn.disabled = true;
    btn.textContent = 'Selecciona un sector para comenzar';
  }
}

function showResults() {

    let videos = sectorData.videos;
    if (!platforms.tiktok) videos = videos.filter(v => v.plataforma === 'Instagram');
    if (!platforms.instagram) videos = videos.filter(v => v.plataforma === 'TikTok');

    const platLabel = [platforms.tiktok ? 'TikTok' : null, platforms.instagram ? 'Instagram Reels' : null].filter(Boolean).join(' + ');
